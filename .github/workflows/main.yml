name: "MLOPS pipeline"
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
    
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Create folders
        run: |
          mkdir -p models
          mkdir -p logs
      - name: Run update
        run: |
            python run.py -mode update
        env:
            ITERATIONS: 1
            
      - name: Run summary
        run: |
          python run.py -mode summary
          
      - name: Save logs
        uses: actions/upload-artifact@v4
        with:
            name: training-logs
            path: logs/
  
      - name: Save model
        uses: actions/upload-artifact@v4
        with:
            name: trained-model
            path: models/
      
  
